
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゾロ目王 ONLINE</title>
<style>
body{font-family:sans-serif;background:#eaf7ed;margin:0;padding:20px;color:#173b25}
main{max-width:500px;margin:auto;background:white;padding:20px;border-radius:16px}
h1{color:#16803d}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px}
input{border:1px solid #aaa}button{border:0;background:#16803d;color:white;font-weight:bold}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>🎲 ゾロ目王 ONLINE</h1>
<p>Firebase接続テスト</p>
<input id="email" type="email" placeholder="メールアドレス">
<input id="password" type="password" placeholder="パスワード">
<button id="login">ログイン</button>
<button id="register">新規登録</button>
<button id="logout">ログアウト</button>
<p id="status">未接続</p>
<hr>
<h2>共有データテスト</h2>
<input id="playerName" placeholder="プレイヤー名">
<button id="save">名前をオンライン保存</button>
<button id="load">共有データを読み込む</button>
<pre id="data"></pre>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUywdd9AX6sCB8FzMWY7-L2oUPQ6ysycU",
  authDomain: "zoromeou-online.firebaseapp.com",
  projectId: "zoromeou-online",
  storageBucket: "zoromeou-online.firebasestorage.app",
  messagingSenderId: "372516850322",
  appId: "1:372516850322:web:d04194b5f421ab2755b44b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const status = document.getElementById("status");
const showError = e => status.textContent = "エラー: " + e.message;

document.getElementById("register").onclick = async () => {
 try {
  await createUserWithEmailAndPassword(auth,email.value.trim(),password.value);
 } catch(e) { showError(e); }
};
document.getElementById("login").onclick = async () => {
 try {
  await signInWithEmailAndPassword(auth,email.value.trim(),password.value);
 } catch(e) { showError(e); }
};
document.getElementById("logout").onclick = () => signOut(auth).catch(showError);

onAuthStateChanged(auth, user => {
 status.textContent = user ? "ログイン中: " + user.email : "未ログイン";
});

document.getElementById("save").onclick = async () => {
 try {
  if(!auth.currentUser) throw Error("先にログインしてね");
  const name = document.getElementById("playerName").value.trim();
  if(!name) throw Error("プレイヤー名を入力してね");
  await setDoc(doc(db,"players",auth.currentUser.uid), {
   name, updatedAt: new Date().toISOString()
  });
  status.textContent = "保存成功！";
 } catch(e) { showError(e); }
};
document.getElementById("load").onclick = async () => {
 try {
  if(!auth.currentUser) throw Error("先にログインしてね");
  const snap = await getDoc(doc(db,"players",auth.currentUser.uid));
  document.getElementById("data").textContent =
   snap.exists() ? JSON.stringify(snap.data(),null,2) : "まだデータがありません";
 } catch(e) { showError(e); }
};
</script>
</body>
</html>
