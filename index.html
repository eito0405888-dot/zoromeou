<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゾロ目王 ONLINE</title>
<style>
body{font-family:sans-serif;background:#eef7ef;color:#173b25;margin:0;padding:16px}
h1{background:#168044;color:white;padding:16px;border-radius:12px}
section{background:white;padding:14px;margin:12px 0;border-radius:12px}
button,input,select{padding:10px;margin:4px;border-radius:7px;border:1px solid #bbb}
button{background:#168044;color:white;border:0}
.result{padding:10px;background:#e5f5e8;border-radius:8px;margin:6px 0}
</style>
</head>
<body>
<h1>🎲 ゾロ目王 ONLINE</h1>

<section>
<h2>プレイヤー登録</h2>
<input id="name" placeholder="プレイヤー名">
<button onclick="addPlayer()">登録（初期50本）</button>
<div id="players"></div>
</section>

<section>
<h2>対戦</h2>
<p>2人以上選択して、各3回サイコロを振る！123が最強。同順位あり。</p>
<div id="selectPlayers"></div>
<input id="stake" type="number" min="0" value="5" placeholder="賭け本数">
<button onclick="play()">対戦開始</button>
<div id="matchResult"></div>
</section>

<section>
<h2>ランキング</h2>
<div id="ranking"></div>
</section>

<section>
<h2>対戦履歴</h2>
<div id="history"></div>
</section>

<script>
const KEY="zoromeou_players_v1";
const HISTORY="zoromeou_history_v1";
let players=JSON.parse(localStorage.getItem(KEY)||"[]");
let history=JSON.parse(localStorage.getItem(HISTORY)||"[]");

function save(){
 localStorage.setItem(KEY,JSON.stringify(players));
 localStorage.setItem(HISTORY,JSON.stringify(history));
 render();
}
function addPlayer(){
 const name=document.getElementById("name").value.trim();
 if(!name)return alert("名前を入力してね");
 if(players.some(p=>p.name===name))return alert("同じ名前があるよ");
 players.push({id:Date.now()+Math.random(),name,balance:50});
 document.getElementById("name").value="";
 save();
}
function hand(rolls){
 const a=[...rolls].sort((x,y)=>x-y);
 if(a.join("")==="123")return {tier:7,value:0,label:"123（最強）"};
 if(a[0]===a[2])return {tier:6,value:a[0],label:"ゾロ目 "+a.join("")};
 if(a[0]===a[1]||a[1]===a[2]){
  const pair=a[0]===a[1]?a[0]:a[1];
  const kicker=a[0]===a[1]?a[2]:a[0];
  return {tier:5,value:pair*10+kicker,label:"ペア "+a.join("")};
 }
 return {tier:4,value:a[2]*100+a[1]*10+a[0],label:"通常 "+a.join("")};
}
function compare(a,b){
 return b.h.tier-a.h.tier || b.h.value-a.h.value;
}
function play(){
 const ids=[...document.querySelectorAll(".who:checked")].map(x=>Number(x.value));
 if(ids.length<2)return alert("2人以上選んでね");
 const stake=Math.floor(Number(document.getElementById("stake").value));
 if(!Number.isFinite(stake)||stake<0)return alert("賭け本数を確認してね");
 const results=ids.map(id=>{
  const p=players.find(x=>x.id===id);
  const rolls=[1,2,3].map(()=>Math.floor(Math.random()*6)+1);
  return {name:p.name,rolls,h:hand(rolls)};
 });
 results.sort(compare);
 let rank=0,previous=null;
 results.forEach((r,i)=>{
  if(!previous||compare(r,previous)!==0)rank=i+1;
  r.rank=rank;previous=r;
 });
 const record={date:new Date().toLocaleString("ja-JP"),results:results.map(r=>({
  name:r.name,rolls:r.rolls,label:r.h.label,rank:r.rank
 }))};
 history.push(record);
 document.getElementById("matchResult").innerHTML=results.map(r=>
  `<div class="result"><b>${r.rank}位 ${escapeHtml(r.name)}</b><br>
  出目：${r.rolls.join("・")}<br>${escapeHtml(r.h.label)}</div>`
 ).join("")+"<p>※銀行残高は対戦で変動しません。</p>";
 save();
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function render(){
 document.getElementById("players").innerHTML=players.map(p=>
  `<div class="result">${escapeHtml(p.name)}：${p.balance}本</div>`
 ).join("");
 document.getElementById("selectPlayers").innerHTML=players.map(p=>
  `<label><input type="checkbox" class="who" value="${p.id}">${escapeHtml(p.name)}</label><br>`
 ).join("");
 document.getElementById("ranking").innerHTML=[...players].sort((a,b)=>b.balance-a.balance).map((p,i)=>
  `<div>${i+1}位　${escapeHtml(p.name)}：${p.balance}本</div>`
 ).join("");
 document.getElementById("history").innerHTML=[...history].reverse().map(h=>
  `<div class="result"><b>${escapeHtml(h.date)}</b><br>`+
  h.results.map(r=>`${r.rank}位 ${escapeHtml(r.name)}：${r.rolls.join("・")} ${escapeHtml(r.label)}`).join("<br>")+
  `</div>`
 ).join("");
}
render();
</script>
</body>
</html>
